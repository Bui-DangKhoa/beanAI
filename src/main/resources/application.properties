# Tên ứng dụng
spring.application.name=beanAI

# Cấu hình kết nối MySQL (hỗ trợ biến môi trường khi deploy production hoặc Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/beanai_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình Thymeleaf (Tắt cache trong môi trường dev)
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:true}
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Cấu hình mã hóa UTF-8 cho HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Cấu hình AI Service mô hình best.pt (Tự động nhận diện hoặc truyền qua biến môi trường)
beanai.python.path=${BEANAI_PYTHON_PATH:}
beanai.model.path=${BEANAI_MODEL_PATH:src/main/resources/static/best.pt}
beanai.script.path=${BEANAI_SCRIPT_PATH:ai-service/predict.py}
beanai.upload.dir=${BEANAI_UPLOAD_DIR:uploads}
# Cấu hình Multipart Upload (Hỗ trợ ảnh độ phân giải cao lên đến 25MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
server.tomcat.max-swallow-size=50MB

# ==========================================
# Cấu hình Quản lý Session & Cookie Bảo mật
# ==========================================
# Giới hạn thời gian sống của HTTP Session (30 phút không hoạt động)
server.servlet.session.timeout=${SERVER_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=BEANAI_SESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax


