<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: header('Đăng ký tài khoản - BeanAI')}">
</head>
<body>

    <!-- NAVBAR CHUNG -->
    <div th:replace="~{layout/base :: navbar}"></div>

    <main class="main-content">
        <div class="auth-wrapper">
            <div class="auth-card" style="max-width: 520px;">
                <div class="text-center mb-4">
                    <span class="logo-icon fs-3 mb-2 d-inline-flex" style="width: 48px; height: 48px;"><i class="bi bi-flower2"></i></span>
                    <h2 class="auth-card-title">Đăng ký tài khoản Nông dân</h2>
                    <p class="text-muted small">Tạo tài khoản để bắt đầu quét chẩn đoán và nhận tư vấn điều trị cây đậu</p>
                </div>

                <!-- THÔNG BÁO LỖI CHUNG (NẾU CÓ) -->
                <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center rounded-3 py-2 px-3 small mb-3 border-0 bg-danger-subtle text-danger">
                    <i class="bi bi-exclamation-octagon-fill fs-5 me-2"></i>
                    <div th:text="${errorMessage}">Đã xảy ra lỗi</div>
                </div>

                <!-- FORM ĐĂNG KÝ -->
                <form th:action="@{/register}" th:object="${registerDTO}" method="post" id="registerForm" novalidate>
                    <!-- Họ và tên -->
                    <div class="mb-3">
                        <label for="fullName" class="form-label small fw-semibold text-secondary">Họ và tên của bạn</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" 
                                   class="form-control border-start-0" 
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                   id="fullName" 
                                   th:field="*{fullName}" 
                                   placeholder="Nguyễn Văn A" 
                                   required>
                        </div>
                        <div class="text-danger small mt-1 d-none" id="fullNameClientFeedback"></div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">
                            Họ và tên không hợp lệ
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold text-secondary">Địa chỉ Email (dùng để đăng nhập)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" 
                                   class="form-control border-start-0" 
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   id="email" 
                                   th:field="*{email}" 
                                   placeholder="nongdan@example.com" 
                                   required>
                        </div>
                        <div class="text-danger small mt-1 d-none" id="emailClientFeedback"></div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                            Email không hợp lệ
                        </div>
                    </div>

                    <!-- Số điện thoại -->
                    <div class="mb-3">
                        <label for="phone" class="form-label small fw-semibold text-secondary">Số điện thoại liên hệ (10 chữ số)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
                            <input type="tel" 
                                   class="form-control border-start-0" 
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                   id="phone" 
                                   th:field="*{phone}" 
                                   placeholder="0912345678" 
                                   required>
                        </div>
                        <div class="text-danger small mt-1 d-none" id="phoneClientFeedback"></div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">
                            Số điện thoại không hợp lệ
                        </div>
                    </div>

                    <!-- Mật khẩu -->
                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold text-secondary">Mật khẩu (tối thiểu 6 ký tự)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" 
                                   class="form-control border-start-0" 
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                   id="password" 
                                   th:field="*{password}" 
                                   placeholder="Tối thiểu 6 ký tự" 
                                   required>
                            <button class="btn btn-outline-secondary border-start-0 bg-white text-muted" type="button" id="togglePassword">
                                <i class="bi bi-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                        <div class="text-danger small mt-1 d-none" id="passwordClientFeedback"></div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                            Mật khẩu không hợp lệ
                        </div>
                    </div>

                    <!-- Xác nhận mật khẩu -->
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label small fw-semibold text-secondary">Xác nhận lại mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
                            <input type="password" 
                                   class="form-control border-start-0" 
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                   id="confirmPassword" 
                                   th:field="*{confirmPassword}" 
                                   placeholder="Nhập lại chính xác mật khẩu trên" 
                                   required>
                        </div>
                        <div class="text-danger small mt-1 d-none" id="confirmPasswordClientFeedback"></div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">
                            Mật khẩu xác nhận không khớp
                        </div>
                    </div>

                    <!-- Nút Đăng ký -->
                    <button type="submit" class="btn btn-primary-bean w-100 py-2 fs-6">
                        Tạo tài khoản ngay <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </form>

                <!-- Đã có tài khoản -->
                <div class="text-center mt-4 pt-3 border-top">
                    <p class="small text-muted mb-0">
                        Đã có tài khoản trên Bean AI? 
                        <a th:href="@{/login}" class="fw-bold text-success text-decoration-none">Đăng nhập tại đây</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER CHUNG -->
    <div th:replace="~{layout/base :: footer}"></div>

    <!-- Toggle Password script & Client-side Validation -->
    <script>
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('bi-eye');
                eyeIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('bi-eye-slash');
                eyeIcon.classList.add('bi-eye');
            }
        });

        // Client-side Validation cho Form Đăng ký
        const form = document.getElementById('registerForm');
        const fullName = document.getElementById('fullName');
        const email = document.getElementById('email');
        const phone = document.getElementById('phone');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');

        const fullNameFeedback = document.getElementById('fullNameClientFeedback');
        const emailFeedback = document.getElementById('emailClientFeedback');
        const phoneFeedback = document.getElementById('phoneClientFeedback');
        const passwordFeedback = document.getElementById('passwordClientFeedback');
        const confirmPasswordFeedback = document.getElementById('confirmPasswordClientFeedback');

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const phonePattern = /^0[0-9]{9}$/;

        function showFieldError(input, feedbackEl, message) {
            input.classList.add('is-invalid');
            feedbackEl.textContent = message;
            feedbackEl.classList.remove('d-none');
        }

        function clearFieldError(input, feedbackEl) {
            input.classList.remove('is-invalid');
            feedbackEl.textContent = '';
            feedbackEl.classList.add('d-none');
        }

        function validateFullName() {
            const val = fullName.value.trim();
            if (!val) {
                showFieldError(fullName, fullNameFeedback, 'Họ và tên không được để trống');
                return false;
            }
            if (val.length > 100) {
                showFieldError(fullName, fullNameFeedback, 'Họ và tên không được vượt quá 100 ký tự');
                return false;
            }
            clearFieldError(fullName, fullNameFeedback);
            return true;
        }

        function validateEmail() {
            const val = email.value.trim();
            if (!val) {
                showFieldError(email, emailFeedback, 'Email không được để trống');
                return false;
            }
            if (!emailPattern.test(val)) {
                showFieldError(email, emailFeedback, 'Email không đúng định dạng (VD: nongdan@example.com)');
                return false;
            }
            clearFieldError(email, emailFeedback);
            return true;
        }

        function validatePhone() {
            const val = phone.value.trim();
            if (!val) {
                showFieldError(phone, phoneFeedback, 'Số điện thoại không được để trống');
                return false;
            }
            if (!phonePattern.test(val)) {
                showFieldError(phone, phoneFeedback, 'Số điện thoại phải gồm đúng 10 chữ số và bắt đầu bằng số 0');
                return false;
            }
            clearFieldError(phone, phoneFeedback);
            return true;
        }

        function validatePassword() {
            const val = password.value;
            if (!val) {
                showFieldError(password, passwordFeedback, 'Mật khẩu không được để trống');
                return false;
            }
            if (val.length < 6) {
                showFieldError(password, passwordFeedback, 'Mật khẩu phải có ít nhất 6 ký tự');
                return false;
            }
            clearFieldError(password, passwordFeedback);
            // Re-validate confirmPassword nếu confirmPassword đã có giá trị
            if (confirmPassword.value) {
                validateConfirmPassword();
            }
            return true;
        }

        function validateConfirmPassword() {
            const val = confirmPassword.value;
            if (!val) {
                showFieldError(confirmPassword, confirmPasswordFeedback, 'Vui lòng xác nhận lại mật khẩu');
                return false;
            }
            if (val !== password.value) {
                showFieldError(confirmPassword, confirmPasswordFeedback, 'Mật khẩu xác nhận không khớp');
                return false;
            }
            clearFieldError(confirmPassword, confirmPasswordFeedback);
            return true;
        }

        // Bắt sự kiện khi người dùng gõ phím để phản hồi tức thời
        fullName.addEventListener('input', validateFullName);
        email.addEventListener('input', validateEmail);
        phone.addEventListener('input', validatePhone);
        password.addEventListener('input', validatePassword);
        confirmPassword.addEventListener('input', validateConfirmPassword);

        // Bắt sự kiện submit form
        form.addEventListener('submit', function (e) {
            const validName = validateFullName();
            const validEmail = validateEmail();
            const validPhone = validatePhone();
            const validPass = validatePassword();
            const validConfirm = validateConfirmPassword();

            if (!validName || !validEmail || !validPhone || !validPass || !validConfirm) {
                e.preventDefault();
                e.stopPropagation();

                // Focus vào trường lỗi đầu tiên
                if (!validName) fullName.focus();
                else if (!validEmail) email.focus();
                else if (!validPhone) phone.focus();
                else if (!validPass) password.focus();
                else if (!validConfirm) confirmPassword.focus();
            }
        });
    </script>
</body>
</html>
