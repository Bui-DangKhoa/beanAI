<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: header('Có lỗi xảy ra - BeanAI')}">
</head>
<body>

    <!-- NAVBAR CHUNG -->
    <div th:replace="~{layout/base :: navbar}"></div>

    <main class="main-content py-5">
        <div class="container text-center" style="max-width: 600px;">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="mb-3">
                    <span class="rounded-circle bg-warning-subtle text-warning d-inline-flex align-items-center justify-content-center" style="width: 72px; height: 72px; font-size: 2.2rem;">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                    </span>
                </div>
                <h3 class="fw-bold text-dark mb-2">Đã xảy ra sự cố</h3>
                <p class="text-muted small mb-4" th:text="${errorMessage != null ? errorMessage : 'Hệ thống đang xử lý yêu cầu hoặc gặp sự cố tạm thời. Vui lòng thử lại sau.'}">
                    Hệ thống đang xử lý yêu cầu hoặc gặp sự cố tạm thời.
                </p>

                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-house-door me-1"></i> Trang chủ
                    </a>
                    <a th:href="@{/login}" class="btn btn-primary-bean px-4">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Đến Đăng nhập
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER CHUNG -->
    <div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
